[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "starlink-crm-api"
version = "0.1.0"
description = "API foundation for StarLink CRM"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2.0",
  "bcrypt>=4.2,<5.0",
  "fastapi>=0.115,<1.0",
  "PyJWT>=2.10,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "SQLAlchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
  "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
